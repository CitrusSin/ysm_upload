name: Docker image

on:
  push:
    branches: [ "main" ]
    tags: [ "*" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
        fetch-depth: 0

    - name: Compute image tags
      id: meta
      shell: bash
      run: |
        image="${REGISTRY}/${GITHUB_REPOSITORY,,}"
        short_sha="${GITHUB_SHA::7}"

        {
          echo "image=${image}"
          echo "tags<<EOF"
          echo "${image}:${short_sha}"

          git tag --points-at "${GITHUB_SHA}" | while read -r git_tag; do
            if [ -n "${git_tag}" ]; then
              echo "${image}:${git_tag}"
            fi
          done

          echo "EOF"
        } >> "${GITHUB_OUTPUT}"

    - uses: docker/setup-buildx-action@v3

    - uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
